<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | قطوف</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">

    <div class="logo-box">
        ❖ قَــطُــوف ❖
    </div>

    <button class="menu-toggle" onclick="toggleMenu()">☰</button>

</header>

<div class="top-buttons" id="topButtons">
    <button onclick="location.href='index.html'">الرئيسية</button>
    <button onclick="location.href='saved.html'">المحفوظ</button>
    <button>تواصل معنا</button>
    <button id="authNavBtn" onclick="location.href='login.html'">تسجيل الدخول</button>
</div>

<div class="auth-page">
  <form class="auth-card" onsubmit="handleSignup(event)">
    <h2>إنشاء حساب جديد</h2>

    <input type="text" id="signupName" placeholder="الاسم">
    <input type="email" id="signupEmail" placeholder="الإيميل">
    <input type="password" id="signupPassword" placeholder="كلمة السر">

    <select id="signupGender">
      <option value="male">ذكر</option>
      <option value="female">أنثى</option>
    </select>

    <label style="display:block;text-align:right;margin-top:10px;font-size:14px;">الصورة الشخصية (اختياري)</label>
    <input type="file" id="signupPhoto" accept="image/*">

    <p class="auth-error" id="signupError"></p>

    <button type="submit" class="auth-submit-btn">إنشاء الحساب</button>

    <p class="auth-switch">عندك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
  </form>
</div>

<script src="script.js"></script>
</body>
</html>
