<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | قطوف</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">

    <div class="logo-box">
        ❖ قَــطُــوف ❖
    </div>

    <button class="menu-toggle" onclick="toggleMenu()">☰</button>

</header>

<div class="top-buttons" id="topButtons">
    <button onclick="location.href='index.html'">الرئيسية</button>
    <button onclick="location.href='saved.html'">المحفوظ</button>
    <button>تواصل معنا</button>
    <button id="authNavBtn" onclick="location.href='login.html'">تسجيل الدخول</button>
</div>

<div class="auth-page">
  <form class="auth-card" onsubmit="handleLogin(event)">
    <h2>تسجيل الدخول</h2>

    <input type="text" id="loginName" placeholder="الاسم">
    <input type="password" id="loginPassword" placeholder="كلمة السر">

    <p class="auth-error" id="loginError"></p>

    <button type="submit" class="auth-submit-btn">دخول</button>

    <p class="auth-switch">لسه معملتش حساب؟ <a href="signup.html">إنشاء حساب جديد</a></p>
  </form>
</div>

<script src="script.js"></script>
</body>
</html>
